<title>{{title}}</title>
<script>/* apply theme before first paint: dark unless the visitor chose light */try{var t=JSON.parse(localStorage.getItem("ls-theme"));}catch(e){var t=null;}document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");</script>
<meta name="description" content="{{description}}">
